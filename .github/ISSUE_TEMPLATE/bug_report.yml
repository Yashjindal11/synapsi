name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or code you ran and the full error. Remove API keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SynapSI version and Python version
      placeholder: "synapsi 0.1.0, Python 3.12"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model (if relevant)
      placeholder: "openai:gpt-4o-mini / mock"
