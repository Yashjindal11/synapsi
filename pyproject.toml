[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "synapsi"
dynamic = ["version"]
description = "Open-source framework for multi-agent deliberation, collective AI reasoning, and experimental evaluation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yash Jindal" }]
requires-python = ">=3.11"
keywords = ["llm", "multi-agent", "deliberation", "debate", "reasoning", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "pyyaml>=6",
  "types-PyYAML",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pre-commit>=3",
  "build>=1",
]

[project.scripts]
synapsi = "synapsi.cli.main:main"

[project.urls]
Documentation = "https://github.com/Yashjindal11/synapsi/tree/main/docs"
Source = "https://github.com/Yashjindal11/synapsi"
Issues = "https://github.com/Yashjindal11/synapsi/issues"

[tool.hatch.version]
path = "src/synapsi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/synapsi"]

[tool.hatch.build.targets.sdist]
include = ["src/synapsi", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
packages = ["synapsi"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml", "uvicorn", "fastapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["synapsi"]
branch = true
